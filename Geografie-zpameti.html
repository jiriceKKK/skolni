<script>
'use strict';
const chapters=JSON.parse(document.getElementById('chapter-data').textContent);
const STORAGE_KEY='geografie-recall-clean-v1';
const checkIcon='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>';
const $=id=>document.getElementById(id);
const escapeHTML=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state={version:1,index:0,finished:false,attempts:{},savedAt:null};
let storageBlocked=false,storageError=false,exportValue='';
function validState(s){return s&&s.version===1&&Number.isInteger(s.index)&&s.index>=0&&s.index<chapters.length&&typeof s.finished==='boolean'&&s.attempts&&typeof s.attempts==='object'&&!Array.isArray(s.attempts)&&Object.entries(s.attempts).every(([id,arr])=>chapters.some(c=>c.id===id)&&Array.isArray(arr)&&arr.every(a=>a&&typeof a.answer==='string'&&typeof a.notes==='string'&&['reading','recall','compare'].includes(a.phase)&&typeof a.startedAt==='string'&&(a.comparedAt===null||typeof a.comparedAt==='string')));}
try{const raw=localStorage.getItem(STORAGE_KEY);if(raw){const loaded=JSON.parse(raw);if(validState(loaded))state=loaded;else throw Error('invalid draft');}}catch(e){storageError=true;}
function showWarning(message){$('warning').textContent=message;$('warning').hidden=!message;}
function persist(){state.savedAt=new Date().toISOString();if(storageBlocked)return;try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));$('save-status').textContent='Koncept uložen v tomto prohlížeči';storageError=false;}catch(e){storageError=true;$('save-status').textContent='Koncept se nepodařilo uložit';showWarning('Prohlížeč nemůže uložit koncept. Tvoje odpovědi zůstávají v tomto okně; před zavřením je exportuj.');}}
function currentChapter(){return chapters[state.index];}
function currentAttempt(id=currentChapter().id){return (state.attempts[id]||[]).at(-1);}
function newAttempt(){return {startedAt:new Date().toISOString(),phase:'reading',answer:'',notes:'',comparedAt:null};}
function ensureAttempt(){const id=currentChapter().id;if(!state.attempts[id])state.attempts[id]=[];if(!state.attempts[id].length)state.attempts[id].push(newAttempt());return currentAttempt();}
function completed(id){return (state.attempts[id]||[]).some(a=>a.comparedAt!==null);}
function completedCount(){return chapters.filter(c=>completed(c.id)).length;}
function words(text){return (text.trim().match(/\S+/g)||[]).length;}
function notesHTML(c){return '<div class="notes">'+c.sections.map(([title,points])=>'<section><h3>'+escapeHTML(title)+'</h3><ul>'+points.map(p=>'<li>'+escapeHTML(p)+'</li>').join('')+'</ul></section>').join('')+(c.clarification?'<details class="clarification"><summary>Upřesnění zápisku</summary><p>'+escapeHTML(c.clarification)+'</p></details>':'')+'</div>';}
function chapterPlain(c){return c.sections.map(([title,points])=>title+'\n'+points.map(p=>'• '+p).join('\n')).join('\n\n')+(c.clarification?'\n\nUPŘESNĚNÍ: '+c.clarification:'');}
function renderNav(){const html=chapters.map((c,i)=>{const done=completed(c.id),a=currentAttempt(c.id);return '<button class="chapter-link '+(state.index===i&&!state.finished?'current':'')+'" data-chapter="'+i+'" '+(state.index===i&&!state.finished?'aria-current="page"':'')+'><span class="chapter-num">'+(done?checkIcon+'<span class="sr-only">Porovnáno</span>':String(i+1).padStart(2,'0'))+'</span><span class="chapter-text">'+escapeHTML(c.short)+'</span>'+(a&&a.phase==='recall'?'<span class="dot" aria-label="Rozepsáno"></span>':'')+'</button>';}).join('');$('chapter-nav').innerHTML=html;$('mobile-chapter-nav').innerHTML=html;$('progress-count').textContent=completedCount()+' / '+chapters.length;$('progress').max=chapters.length;$('progress').value=completedCount();}
function render(focus=true){renderNav();const c=currentChapter(),a=currentAttempt(),phase=a?a.phase:'reading';$('workspace').className='workspace'+(phase==='compare'&&!state.finished?' wide':'');
if(state.finished){const count=completedCount();$('workspace').innerHTML='<section class="finish"><span class="counter">Konec procvičování</span><h1 id="page-title" tabindex="-1">'+(count===chapters.length?'Všechny kapitoly prošlé.':'Došel jsi na konec.')+'</h1><p>Porovnáno <strong>'+count+' z '+chapters.length+'</strong> kapitol. Exportuj své odpovědi a pošli je AI k vyhodnocení.</p><div class="actions"><button class="primary" data-action="export">Exportovat výsledky</button><button data-action="return">Vrátit se ke kapitolám</button></div><div class="finish-list">'+chapters.map((c,i)=>'<button class="finish-row" data-chapter="'+i+'"><span class="chapter-num">'+String(i+1).padStart(2,'0')+'</span><strong>'+escapeHTML(c.short)+'</strong><span>'+(completed(c.id)?'Porovnáno':(currentAttempt(c.id)?.answer?'Rozepsáno':'Neprocvičeno'))+'</span></button>').join('')+'</div></section>';}
else{const phaseIndex=['reading','recall','compare'].indexOf(phase);const stepper='<ol class="steps" aria-label="Kroky procvičování">'+['Čtení','Zpaměti','Porovnání'].map((s,i)=>'<li class="'+(i===phaseIndex?'active':i<phaseIndex?'passed':'')+'" '+(i===phaseIndex?'aria-current="step"':'')+'><span class="step-num">'+(i<phaseIndex?'✓':i+1)+'</span>'+s+'</li>').join('')+'</ol>';
const intro=phase==='reading'?'Přečti si kapitolu. Až budeš připravený, skryj ji a napiš, co si pamatuješ.':phase==='recall'?'Zápisek je skrytý. Napiš co nejvíc vlastními slovy. Na pořadí ani přesném znění nezáleží.':'Porovnej svou odpověď se zápiskem. Chybějící věci si můžeš poznamenat zvlášť.';
let content=stepper+'<span class="counter">Kapitola '+String(state.index+1).padStart(2,'0')+' / '+String(chapters.length).padStart(2,'0')+'</span><h1 id="page-title" tabindex="-1">'+escapeHTML(c.title)+'</h1><p class="intro">'+intro+'</p>';
if(phase==='reading'){content+='<article class="paper" aria-label="Zápisek ke čtení">'+notesHTML(c)+'</article><div class="actions"><span class="hint">Bez časového limitu.</span><button class="primary" data-action="recall">Skrýt zápisek a psát</button></div>';}
if(phase==='recall'){content+='<div class="answer-paper"><div class="paper-label"><label for="answer">Moje odpověď zpaměti</label><span id="word-count">'+words(a.answer)+' slov</span></div><textarea id="answer" class="recall-input" placeholder="Začni tím, co si vybavíš…" maxlength="100000">'+escapeHTML(a.answer)+'</textarea></div><div class="actions"><span class="hint">Můžeš exportovat i rozepsanou odpověď.</span><button class="primary" data-action="compare">Odkryt a porovnat</button></div>';}
if(phase==='compare'){content+='<div class="compare-grid"><section class="compare-col"><h2 class="compare-heading">Moje odpověď<span>Zpaměti</span></h2><div class="compare-body answer-readonly">'+(a.answer?escapeHTML(a.answer):'<span class="empty">Odevzdal jsi prázdnou odpověď.</span>')+'</div></section><section class="compare-col"><h2 class="compare-heading">Zápisek<span>Učivo</span></h2><div class="compare-body">'+notesHTML(c)+'</div></section></div><div class="corrections"><label for="corrections">Co jsem vynechal nebo popletl <span>(volitelné)</span></label><textarea id="corrections" maxlength="50000" placeholder="Pár bodů, ke kterým se chci vrátit…">'+escapeHTML(a.notes)+'</textarea><p>Původní odpověď zůstává zachovaná. Toto doplnění je v exportu zvlášť.</p></div><div class="actions"><button class="text-button" data-action="repeat">Zopakovat kapitolu</button><button class="primary" data-action="next">'+(state.index===chapters.length-1?'Dokončit procvičování':'Další kapitola')+'</button></div>';}
$('workspace').innerHTML=content;}
if(focus){window.scrollTo({top:0,behavior:'instant'});requestAnimationFrame(()=>{const target=$('answer')||$('page-title');if(target)target.focus({preventScroll:true});});}}
function navigate(index){if(!Number.isInteger(index)||index<0||index>=chapters.length)throw Error('Neplatná kapitola.');state.index=index;state.finished=false;persist();render();$('chapters-dialog').close();}
function startRecall(){const a=ensureAttempt();if(a.phase!=='reading')return;a.phase='recall';persist();render();}
function compare(){const a=ensureAttempt();if(a.phase!=='recall')return;a.phase='compare';a.comparedAt=new Date().toISOString();persist();render();}
function repeat(){const id=currentChapter().id;if(!state.attempts[id])state.attempts[id]=[];state.attempts[id].push(newAttempt());state.finished=false;persist();render();}
function next(){if(state.index===chapters.length-1){state.finished=true;persist();render();}else navigate(state.index+1);}
function buildExport(){const chunks=['GEOGRAFIE — VÝSLEDKY ACTIVE RECALL','Export: '+new Date().toLocaleString('cs-CZ'),'Porovnané kapitoly: '+completedCount()+' / '+chapters.length,'\nZADÁNÍ PRO AI','Porovnej moje odpovědi zpaměti s přiloženým učivem. U každé procvičené kapitoly označ správné informace, chyby a chybějící body. Hodnoť význam, ne přesné formulace. Doplnění po odkrytí nepočítej jako vybavení zpaměti. Rozepsanou odpověď ber jako neúplnou; neprocvičené kapitoly nehodnoť jako špatné. Nakonec napiš krátký seznam toho, co si mám zopakovat.'];
chapters.forEach((c,i)=>{const list=(state.attempts[c.id]||[]).filter(a=>a.answer.trim()||a.comparedAt);chunks.push('\n'+'='.repeat(42)+'\n'+(i+1)+'. '+c.title);if(!list.length){chunks.push('NEPROCVIČENO — bez odevzdané nebo rozepsané odpovědi.');return;}chunks.push('\nUČIVO\n'+chapterPlain(c));list.forEach((a,n)=>{chunks.push('\nPOKUS '+(n+1)+' — '+(a.comparedAt?'ODEVZDÁNO; zápisek byl odkryt':'ROZEPSÁNO; zápisek zatím nebyl odkryt'),'MOJE ODPOVĚĎ ZPAMĚTI\n'+(a.answer||'[Prázdná odevzdaná odpověď.]'));if(a.notes.trim())chunks.push('DOPLNĚNÍ PO ODKRYTÍ — nehodnotit jako vybavení\n'+a.notes);});});return chunks.join('\n');}
function openExport(){exportValue=buildExport();$('export-text').value=exportValue;$('export-feedback').textContent=completedCount()+' z '+chapters.length+' kapitol porovnáno. Rozepsané odpovědi jsou zahrnuté.';$('export-dialog').showModal();}
async function copyExport(){try{await navigator.clipboard.writeText(exportValue);$('export-feedback').textContent='Zkopírováno. Teď vlož text do AI.';}catch(e){$('export-text').focus();$('export-text').select();$('export-feedback').textContent='Text je vybraný. Zkopíruj ho ručně (Ctrl+C nebo nabídka Kopírovat).';}}
function downloadExport(){const blob=new Blob(['\uFEFF',exportValue],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='geografie-odpovedi-'+new Date().toISOString().slice(0,10)+'.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);$('export-feedback').textContent='Export je připravený ke stažení.';}
document.addEventListener('click',e=>{const chapterButton=e.target.closest('[data-chapter]');if(chapterButton){navigate(Number(chapterButton.dataset.chapter));return;}const button=e.target.closest('[data-action]');if(!button)return;const action=button.dataset.action;const actions={recall:startRecall,compare,repeat,next,export:openExport,copy:copyExport,download:downloadExport,menu:()=>$('chapters-dialog').showModal(),'close-menu':()=>$('chapters-dialog').close(),'close-export':()=>$('export-dialog').close(),return:()=>{const i=chapters.findIndex(c=>!completed(c.id));navigate(i<0?0:i);}};if(actions[action])actions[action]();});
document.addEventListener('input',e=>{if(e.target.id==='answer'){ensureAttempt().answer=e.target.value;$('word-count').textContent=words(e.target.value)+' slov';persist();}if(e.target.id==='corrections'){ensureAttempt().notes=e.target.value;persist();}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)&&e.target.id==='answer'){e.preventDefault();compare();}});
window.addEventListener('storage',e=>{if(e.key===STORAGE_KEY&&e.newValue){try{const other=JSON.parse(e.newValue);if(other.savedAt!==state.savedAt){storageBlocked=true;showWarning('Postup se změnil v jiném okně. Odpovědi v tomto okně můžeš exportovat; pro načtení druhého postupu obnov stránku.');$('save-status').textContent='Změna v jiném okně';}}catch{}}});
window.addEventListener('beforeunload',e=>{if((storageError||storageBlocked)&&Object.values(state.attempts).some(arr=>arr.some(a=>a.answer))){e.preventDefault();e.returnValue='';}});
render(false);if(storageError)showWarning('Uložený koncept není dostupný. Můžeš pokračovat; výsledky si před zavřením exportuj.');
if(document.modelContext?.registerTool){const lifecycle=new AbortController();const register=t=>{try{Promise.resolve(document.modelContext.registerTool(t,{signal:lifecycle.signal})).catch(()=>{});}catch{}};register({name:'read_study_results',title:'Přečíst výsledky',description:'Vrátí aktuální odpovědi včetně rozpracovaných pokusů a učiva pro porovnání.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:true},execute(input){if(!input||typeof input!=='object'||Object.keys(input).length)throw Error('Nástroj nepřijímá parametry.');return {completed:completedCount(),total:chapters.length,text:buildExport()};}});register({name:'navigate_study_chapter',title:'Otevřít kapitolu',description:'Otevře kapitolu v jejím aktuálním kroku a zachová odpovědi. Neodkrývá zápisek při psaní.',inputSchema:{type:'object',properties:{chapterNumber:{type:'integer',minimum:1,maximum:chapters.length}},required:['chapterNumber'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute(input){if(!input||typeof input!=='object'||Object.keys(input).length!==1||!Number.isInteger(input.chapterNumber))throw Error('Zadej číslo kapitoly.');navigate(input.chapterNumber-1);return {chapter:state.index+1,title:currentChapter().title};}});window.addEventListener('pagehide',()=>lifecycle.abort(),{once:true});}
</script>
